name: CI & Railway Production Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci-test-and-build:
    name: Build & Verify (PHP 8.4 + Vite)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP 8.4
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, mysql, pdo_sqlite, bcmath, gd
        coverage: none

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install PHP Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Install Node Dependencies
      run: npm ci || npm install --legacy-peer-deps

    - name: Build Frontend Assets (Vite)
      run: npm run build
      env:
        VITE_APP_NAME: "Elevate Interiors"

    - name: Prepare Test Environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Run Feature Test Suites
      run: php artisan test tests/Feature/StockMovementTest.php tests/Feature/CatalogManagementTest.php

  # Optional: Triggers Railway CLI deployment if RAILWAY_TOKEN secret is configured in GitHub Secrets.
  # If you rely on Railway's native GitHub App integration, Railway will automatically deploy on push to main!
  railway-deploy:
    name: Railway Deployment Trigger
    needs: ci-test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI & Deploy (Optional Token Flow)
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli
          railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
